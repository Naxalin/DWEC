<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanban de Tareas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <h1 class="text-center mb-5">Gestión de Tareas</h1>
    <div class="row g-4 justify-content-center">
      <div class="col-md-4 d-flex flex-column align-items-center">
        <div class="card shadow-sm w-100">
          <div class="card-header bg-primary text-white text-center">
            Tareas por iniciar
          </div>
          <div class="pendiente list-group list-group-flush d-flex flex-column align-items-center"></div>
        </div>
      </div>
      <div class="col-md-4 d-flex flex-column align-items-center">
        <div class="card shadow-sm w-100">
          <div class="card-header bg-warning text-dark text-center">
            Tareas en proceso
          </div>
          <div class="proceso list-group list-group-flush d-flex flex-column align-items-center"></div>
        </div>
      </div>
      <div class="col-md-4 d-flex flex-column align-items-center">
        <div class="card shadow-sm w-100">
          <div class="card-header bg-success text-white text-center">
            Tareas terminadas
          </div>
          <div class="terminada list-group list-group-flush d-flex flex-column align-items-center"></div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./Script/App.js"></script>
</body>
</html>
