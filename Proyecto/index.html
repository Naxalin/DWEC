<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <header class="bg-light py-2">
        <form class="container d-flex align-items-center gap-3">

            <select name="categoria" id="categoria" class="form-select w-auto">
                <option value="">-- Categoria --</option>
            </select>

            <select name="marca" id="marca" class="form-select w-auto">
                <option value="">-- Marca --</option>
            </select>

            <div class="input-group w-auto">
                <input type="search" name="busqueda" id="busqueda" class="form-control">
                <label for="busqueda" class="input-group-text">
                    <img src="./img/lupa.png" alt="" width="20">
                </label>
            </div>

            <img src="./img/login.png" alt="" id="login" width="30"  style="cursor: pointer;"  class="ms-auto iniciarSesion">
            <img src="./img/carrito.png" alt="" id="carrito" width="30" class="abrirCarrito">

        </form>

    </header>
    <main class="container-xl my-4">
        <div id="productos" class="row g-4"></div>
    </main>
    
    <div class="modal-lg">
        <div class="modal">
                
        </div>
    </div>
    <script src="./Script/main.js"></script>
    <script src="./Script/modal.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
