<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./styles/main.css">
</head>
<body class="bg-light text-dark">
  <div class="container py-5">
    <h2 class="mb-4 text-center">Lista</h2>
    <div class="ListaSoporte mb-4 border rounded p-3 bg-white shadow-sm"></div>
    <form class="mb-3">
      <div class="mb-3">
        <label for="inventario" class="form-label">Selecciona un objeto</label>
        <select name="inventario" id="inventario" class="form-select">
          <option value="nada">--- Selecciona un objeto ---</option>
        </select>
      </div>
    </form>
    <div id="datosInventario" class="mb-3"></div>
    <button id="calcular" class="btn btn-primary mb-3">Calcular Autonomía</button>
    <div class="autonomia border rounded p-3 bg-white shadow-sm"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./scripts/main.js"></script>
</body>
</html>
