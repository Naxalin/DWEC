<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3 Columnas Bootstrap</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container mt-3">
      <div class="row g-3">
        <!-- Columna de filtros -->
        <div class="col-12 col-md-3 bg-primary text-white p-3">
          <form>
            <div class="mb-3">
              <label for="pais" class="form-label">Países</label>
              <select name="pais" id="pais" class="form-select">
                <option value="todos">----- Todos -----</option>
              </select>
            </div>
            <div id="checks" class="mb-3"></div>
            <div class="mb-3">
              <label for="maximo" class="form-label">Presupuesto Máximo</label>
              <input
                type="range"
                name="maximo"
                id="maximo"
                class="form-range"
                min="0"
                max="1000"
              />
            </div>
          </form>
        </div>

        <!-- Columna de actividades -->
        <div class="col-12 col-md-6" id="actividades">
          <!-- Ejemplo de tarjeta con solo Bootstrap -->
          <!-- Se pueden generar dinámicamente con JS -->
          <div class="card mb-3 shadow-sm">
            <div class="card-body">
              <h5 class="card-title">Actividad Ejemplo</h5>
              <p class="card-text">Descripción de la actividad...</p>
              <p class="card-text">
                <small class="text-muted">Precio: 200€ | Duración: 3h</small>
              </p>
              <button class="btn btn-success btn-sm">Añadir</button>
            </div>
          </div>
        </div>

        <!-- Columna de resumen y formulario -->
        <div class="col-12 col-md-3 bg-danger text-white p-3" id="resumen">
          <div>
            <p>Cantidad: <span id="cantidadActividades">0</span></p>
          </div>
          <div id="actividadesAñadidas"></div>
          <div>
            <p>Duración: <span id="duracionViaje">0</span> h</p>
          </div>
          <div>
            <p>Precio: <span id="costeViaje">0</span> €</p>
          </div>

          <form id="reservaForm" class="text-start mt-3">
            <div class="mb-3">
              <label for="nombre" class="form-label">Nombre Completo</label>
              <input type="text" id="nombre" class="form-control" required>
              <div class="invalid-feedback">El nombre es obligatorio.</div>
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" id="email" class="form-control" required>
              <div class="invalid-feedback">Introduce un email válido.</div>
            </div>

            <div class="mb-3">
              <label for="fechaInicio" class="form-label">Fecha de Inicio</label>
              <input type="date" id="fechaInicio" class="form-control" required>
              <div class="invalid-feedback">Selecciona una fecha de inicio.</div>
            </div>

            <div class="mb-3">
              <label for="codigoDescuento" class="form-label">Código de Descuento</label>
              <input type="text" id="codigoDescuento" class="form-control">
            </div>

            <div class="mb-3 form-check d-none" id="seguroContainer">
              <input type="checkbox" class="form-check-input" id="seguroViaje" required>
              <label class="form-check-label" for="seguroViaje">
                Seguro de Viaje (obligatorio si coste &gt; 1000€)
              </label>
            </div>

            <button type="submit" class="btn btn-light w-100">Confirmar Reserva</button>
            <div id="errores" class="mt-3 text-light"></div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./Script/script.js"></script>
  </body>
</html>
