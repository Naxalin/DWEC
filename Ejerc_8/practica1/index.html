<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="./Style/style.css">
</head>
<body>
    <form action="">
        <label for="tamaño">Pequeña</label>
        <input type="radio" data-precio="10.00" name="Pequeño" id="tamaño">
        <br>
        <label for="tamaño">Mediana</label>
        <input type="radio" data-precio="12.00" name="mediano" id="tamaño">

    <button>Realizar Pedido</button>

    <script src="./Script/script.js"></script>
