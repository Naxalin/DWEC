<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productos</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Si quieres mantener tus estilos originales de .producto-card */
    .producto-card {
      /* tus estilos anteriores aquí */
    }
  </style>
</head>
<body class="bg-light">

  <div class="container py-5">

    <div class="card shadow-sm p-4 mb-5">
      <h2 class="card-title mb-4 text-center">Filtrar Productos</h2>

      <form>
        <div class="mb-3">
          <label for="busqueda" class="form-label">Búsqueda</label>
          <input type="text" name="busqueda" id="busqueda" class="form-control" placeholder="Escribe un producto...">
        </div>

        <div class="mb-3 d-flex gap-2 justify-content-center">
          <button type="button" id="precioMayorAMenor" class="btn btn-primary flex-fill">Mayor a Menor</button>
          <button type="button" id="precioMenorAMayor" class="btn btn-outline-primary flex-fill">Menor a Mayor</button>
        </div>

        <div class="row mb-3">
          <div class="col-md-6">
            <label for="categoria" class="form-label">Categorías</label>
            <select name="categoria" id="categoria" class="form-select">
              <option value="todas">-- Selecciona una categoría --</option>
              <option value="Tecnología">Tecnología</option>
              <option value="Accesorios">Accesorios</option>
              <option value="Fotografía">Fotografía</option>
              <option value="Oficina">Oficina</option>
              <option value="Audio">Audio</option>
            </select>
          </div>

          <div class="col-md-6">
            <label for="precioAscendente" class="form-label">Máximo</label>
            <input type="range" name="precioAscendente" id="precioAscendente" class="form-range" min="0" max="600">
          </div>
        </div>
      </form>
    </div>

    <!-- Contenedor de productos -->
    <div id="productos" class="row g-4"></div>

  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="./script/script.js"></script>
</body>
</html>
