<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
          rel="stylesheet" 
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" 
          crossorigin="anonymous">
      <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

</head>
<body>
   <div class="container text-center mt-5">
    <div class="btn-group mt-3" role="group" aria-label="Toggle fondo">
      <button type="button" class="btn btn-warning btn-light">
        <i class="bi bi-sun-fill"></i> Blanco
      </button>
      <button type="button" class="btn btn-dark text-light">
        <i class="bi bi-moon-fill"></i> Oscuro
      </button>
    </div>
  </div>


    <div class="container my-4">
        <h1 class="mb-3 titulo">Listado de Productos</h1>
        <div class="mb-4">
            <label for="categorias" class="form-label">Filtrar por categoría:</label>
            <select class="form-select" name="categorias" id="categorias">
                <option value="">--- Todas ---</option>
            </select>
        </div>
        <div class="mb-4">
            <label for="ordenPrecio">Ordenar por precio:</label>
            <select name="ordenPrecio" id="ordenPrecio">
                <option value="">-- Selecciona --</option>
                <option value="asc">Menor a mayor</option>
                <option value="desc">Mayor a menor</option>
            </select>
        </div>
        <div id="muestraProductos" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" 
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" 
            crossorigin="anonymous"></script>
    <script src="./Script/main.js"></script>
</body>
</html>
