<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <form class="border p-4 bg-white shadow-sm rounded">

        <label for="nombre" class="form-label">Nombre: </label>
        <input type="text" class="form-control" name="nombre" id="nombre" required placeholder="Monitor...">
        <div id="mensajeErrorNombre"></div>
        <br>

        <label for="sku" class="form-label">SKU: </label>
        <input type="text" class="form-control" name="sku" required id="sku">
        <div id="mensajeErrorSku"></div>

        <br>

        <label for="precio" class="form-label">Precio: </label>
        <input type="number" class="form-control" name="precio" id="precio"  required placeholder="20">
        <div id="mensajeErrorPrecio"></div>
        <br>

        <label for="stock" class="form-label">Stock: </label>
        <input type="number" class="form-control" name="stock" id="stock"  required placeholder="200">
        <div id="mensajeErrorStock"></div>
        <br>

        <label for="categoria" class="form-label">Categoria: </label>
        <input type="text" class="form-control" name="categoria" id="categoria" placeholder="Periféricos">
        <div id="mensajeErrorCategoria"></div>
        <br>

        <button type="submit" class="btn btn-primary" disabled>Guardar</button>

    </form>
</div>
<script src="./Script/main.js"></script>
</body>
</html>
