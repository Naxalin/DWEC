<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
        rel="stylesheet"
    >
</head>
<body class="p-4">

    <div class="container">
        <div class="row">

            <div class="col-md-4">
                <h3 class="mb-3">Añadir / Editar Usuario</h3>

                <form action="" class="border p-3 rounded shadow-sm bg-light">
                    
                    <label for="nombre" class="form-label">Nombre</label>
                    <input type="text" name="nombre" id="nombre" class="form-control">
                    <div id="nombreError" class="text-danger small"></div>

                    <label for="apellido" class="form-label mt-3">Apellido</label>
                    <input type="text" name="apellido" id="apellido" class="form-control">
                    <div id="apellidoError" class="text-danger small"></div>

                    <label for="email" class="form-label mt-3">Email</label>
                    <input type="email" name="email" id="email" class="form-control">
                    <div id="emailError" class="text-danger small"></div>

                    <label for="url" class="form-label mt-3">URL de la imagen</label>
                    <input type="url" name="url" id="url" class="form-control">
                    <div id="urlError" class="text-danger small"></div>

                    <button type="bu" class="btn btn-primary mt-4 guardar" disabled>
                        Guardar Usuario
                    </button>
                    <div id="mensajeAlert"></div>
                </form>
            </div>

            <div class="col-md-8">
                <div>

                <h3 class="mb-3">Lista de Usuarios</h3>
                <input type="search" name="busqueda" id="busqueda" placeholder="busqueda">

                </div>

                <div id="mensajeCarga" class="mb-3"></div>

                <table class="table table-striped table-bordered">
                    <thead class="table-dark">
                        <tr>
                            <th>Imagen</th>
                            <th>datos</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="lista"></tbody>
                </table>
            </div>

        </div>
    </div>

    <script src="./Script/main.js"></script>
    <script src="./Script/verificarFormulario.js"></script>
    <script 
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
    </script>
</body>
</html>
